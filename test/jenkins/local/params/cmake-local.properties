# Build parameters run-local.ps1 passes to the cmake-local job.
# {{REPO_URL}} becomes file:///C:/.../JenkinsLib (your working copy).
GIT_REPO_URL={{REPO_URL}}
GIT_BRANCH=jenkins-local
CMAKE_SOURCE_DIR=test/jenkins/sample-cmake
CMAKE_BUILD_DIR=build-sample
CMAKE_GENERATOR=Ninja
CMAKE_PLATFORM=x64
CLEAN_WORKSPACE=false
